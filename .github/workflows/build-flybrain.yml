name: Build FlyBrain Fabric JAR

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/main/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/build-flybrain.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Fabric JAR
        run: ./gradlew build --no-daemon

      - name: Upload FlyBrain JAR
        uses: actions/upload-artifact@v4
        with:
          name: flybrain-fabric-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
